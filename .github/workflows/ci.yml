name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # private repo can't use GHAS secret scanning — grep for the key shapes
      # we actually handle so a leaked credential fails the build
      - name: Secret pattern check
        run: |
          ! git ls-files -z | xargs -0 grep -nE '(sk-[A-Za-z0-9_-]{20,}|GOCSPX-[A-Za-z0-9_-]{10,}|BEGIN (RSA |EC )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35})' \
            || (echo "::error::possible secret committed" && exit 1)
      - run: npm run typecheck
      - run: npx eslint src tests
      - run: node_modules/.bin/vitest run tests/
      - run: npm run build
        env:
          OPENAI_API_KEY: ""   # build must not need real keys
